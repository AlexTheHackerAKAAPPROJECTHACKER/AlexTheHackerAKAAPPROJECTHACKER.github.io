<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Launcher</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 1rem; }
    button { margin: 5px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Launch a Site</h1>
  <button onclick="launchSite('https://example.com')">Open Example.com</button>
  <button onclick="launchInBlank()">Inject My Site into about:blank</button>

  <script>
    function launchSite(url) {
      window.open(url, '_blank');
    }

    function launchInBlank() {
      const newWindow = window.open('about:blank', '_blank');
      if (newWindow) {
        const content = `
          <!DOCTYPE html>
          <html>
          <head><title>Injected</title></head>
          <body>
            <h1>This is a custom page injected into about:blank</h1>
            <p>Hosted from GitHub Pages!</p>
          </body>
          </html>
        `;
        newWindow.document.open();
        newWindow.document.write(content);
        newWindow.document.close();
      } else {
        alert("Popup blocked!");
      }
    }
  </script>
</body>
</html>
